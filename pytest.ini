[pytest]
testpaths = tests
# faulthandler is off: libmpv raises and handles an internal SEH exception
# (0xe24c4a02) inside mpv.terminate(); faulthandler prints it as a scary but
# harmless "fatal exception" and buries the real test output.
addopts = -ra -p no:faulthandler
markers =
    e2e: sends real mouse input (moves the cursor); run with --run-e2e or PANE_E2E=1
filterwarnings =
    ignore::DeprecationWarning
